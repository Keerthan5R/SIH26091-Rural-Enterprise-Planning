    channel: District office of the corporation
  - state: Uttar Pradesh
    state_code: UP
    corporations: [nsfdc, nbcfdc]
    name: U.P. Scheduled Castes Finance and Development Corporation Ltd.
    name_hi: उत्तर प्रदेश अनुसूचित जाति वित्त एवं विकास निगम लिमिटेड
    name_kn: ಉತ್ತರ ಪ್ರದೇಶ ಪರಿಶಿಷ್ಟ ಜಾತಿ ಹಣಕಾಸು ಮತ್ತು ಅಭಿವೃದ್ಧಿ ನಿಗಮ ಲಿಮಿಟೆಡ್
