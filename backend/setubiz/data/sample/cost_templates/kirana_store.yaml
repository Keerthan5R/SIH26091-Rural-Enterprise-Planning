id: kirana_store
name: Village kirana (grocery) store
name_hi: गाँव की किराना दुकान
name_kn: ಗ್ರಾಮದ ಕಿರಾಣಿ ಅಂಗಡಿ
category: kirana
unit: 1 counter shop, ~120 sq ft
activity_kind: general
source: "NABARD Model Bankable Project: Rural Retail Outlet; district trade margin norms"
fixed_capital:
  - {item: "Shelving, counter and storage racks", item_hi: रैक एवं काउंटर, item_kn: "ಕಪಾಟು, ಕೌಂಟರ್ ಮತ್ತು ಶೇಖರಣಾ ರ್ಯಾಕ್", amount: 42000, scaling: linear}
  - {item: "Weighing scale, sealer, small deep freezer", item_hi: तराजू एवं फ्रीजर, item_kn: "ತೂಕ ಮಾಪಕ, ಸೀಲರ್ ಮತ್ತು ಸಣ್ಣ ಫ್ರೀಜರ್", amount: 38000, scaling: fixed}
  - {item: "Shop fit-out, wiring, shutter", item_hi: दुकान सज्जा, item_kn: "ಅಂಗಡಿ ಸಜ್ಜು, ವೈರಿಂಗ್, ಶಟರ್", amount: 30000, scaling: fixed}
  - {item: Opening stock (non-recurring build-up), item_hi: प्रारंभिक स्टॉक, item_kn: "ಆರಂಭಿಕ ಸ್ಟಾಕ್", amount: 60000, scaling: linear}
working_capital_months: 1
base_units: 1
unit_label: counter
unit_label_hi: काउंटर
unit_label_kn: ಕೌಂಟರ್
unit_range: [1, 2]
monthly_revenue:
  - {item: Gross sales @ 11% blended trade margin, item_hi: सकल बिक्री मार्जिन, item_kn: "ಸಕಲ ಮಾರಾಟ (11% ವ್ಯಾಪಾರ ಮಾರ್ಜಿನ್)", amount: 46200, scaling: linear}
monthly_opex:
  - {item: Restocking transport and loading, item_hi: माल ढुलाई, item_kn: "ಸರಕು ಸಾಗಣೆ ಮತ್ತು ಲೋಡಿಂಗ್", amount: 3800, scaling: linear}
  - {item: Shop rent, item_hi: दुकान किराया, item_kn: "ಅಂಗಡಿ ಬಾಡಿಗೆ", amount: 3500, scaling: linear}
  - {item: Electricity and cold storage running cost, item_hi: बिजली, item_kn: "ವಿದ್ಯುತ್ ಮತ್ತು ಕೋಲ್ಡ್ ಸ್ಟೋರೇಜ್ ವೆಚ್ಚ", amount: 2600, scaling: fixed}
  - {item: Credit-sales shrinkage and spoilage provision, item_hi: उधार एवं क्षति प्रावधान, item_kn: "ಉಧಾರ ಮತ್ತು ಹಾಳಾಗುವಿಕೆ ಭತ್ಯೆ", amount: 4200, scaling: linear}
  - {item: Part-time help, item_hi: सहायक, item_kn: "ಅರೆಕಾಲಿಕ ಸಹಾಯಕ", amount: 4000, scaling: step, step_capacity: 1}
assumptions:
  - Revenue line is gross margin, not turnover. Turnover at this margin is ≈ ₹4.2 L/month.
  - Village kirana runs on credit; the shrinkage provision is deliberately conservative.
  - The freezer, the fit-out and the power bill belong to the premises and do not change with counter space; stock and turnover do.
