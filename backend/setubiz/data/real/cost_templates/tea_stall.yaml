source: "SetuBiz unit economics compiled from PMEGP/NABARD service-sector cost norms (rural Jharkhand rates)"
fixed_capital:
  - {item: Tea kiosk, semi-pucca construction, item_hi: चाय की दुकान (अर्ध-पक्का), item_kn: "ಚಹಾ ಕಿಯೋಸ್ಕ್ (ಅರೆ-ಪಕ್ಕಾ)", amount: 60000, scaling: linear}
  - {item: "Tea stove, kettle and urn set", item_hi: चूल्हा, केतली एवं भरपाई सेट, item_kn: "ಚಹಾ ಒಲೆ, ಕೆಟಲ್ ಮತ್ತು ಪಾತ್ರೆ ಸೆಟ್", amount: 8000, scaling: linear}
  - {item: Utensils, crockery and glassware, item_hi: बर्तन एवं गिलास, item_kn: "ಪಾತ್ರೆ, ಕಪ್ ಮತ್ತು ಗಾಜು ಸಾಮಗ್ರಿ", amount: 6000, scaling: linear}
  - {item: "Benches, tables and stall lighting", item_hi: बेंच, मेज एवं बिजली व्यवस्था, item_kn: "ಬೆಂಚ್, ಮೇಜು ಮತ್ತು ದೀಪ ವ್ಯವಸ್ಥೆ", amount: 9000, scaling: linear}
  - {item: Signboard and paint, item_hi: साइनबोर्ड, item_kn: "ಸೈನ್ಬೋರ್ಡ್ ಮತ್ತು ಬಣ್ಣ", amount: 3000, scaling: fixed}
