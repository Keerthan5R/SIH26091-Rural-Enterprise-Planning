    corporations: [nsfdc]
    name: Dr. B.R. Ambedkar Development Corporation Limited
    name_hi: ಡಾ. ಬಿ.ಆರ್. ಅಂಬೇಡ್ಕರ್ ಅಭಿವೃದ್ದಿ ನಿಗಮ ನಿಯಮಿತ
