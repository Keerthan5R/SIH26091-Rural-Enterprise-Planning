# SWOT rule library. Conditions are evaluated deterministically over computed metrics:
# the language model may paraphrase these lines, but it may not invent one (PLAN.md §4).
#
# `when` is a single condition or `all:` / `any:` of conditions. Operators: == != > >= < <=.
# `text_*` is str.format()-ed against the metrics dict, so every number in a SWOT line is grounded.

rules:
  - id: underserved_market
    quadrant: opportunity
    when: {metric: demand_supply_ratio, op: ">=", value: 1.15}
    text_en: >-
      Estimated monthly spend on this category in the catchment is about
      {demand_supply_ratio}× what the existing {competitors_point} enterprises can absorb, so
      there is room for another unit.
    text_hi: >-
      क्षेत्र में इस श्रेणी पर अनुमानित मासिक खर्च मौजूदा {competitors_point} इकाइयों की क्षमता से
      लगभग {demand_supply_ratio} गुना है, इसलिए एक और इकाई के लिए जगह है।
    text_kn: >-
      ಈ ಪ್ರದೇಶದಲ್ಲಿ ಈ ವರ್ಗದ ಮೇಲಿನ ಅಂದಾಜು ಮಾಸಿಕ ಖರ್ಚು ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ {competitors_point}
      ಉದ್ಯಮಗಳು ಹೀರಿಕೊಳ್ಳಬಲ್ಲ ಸಾಮರ್ಥ್ಯದ ಸುಮಾರು {demand_supply_ratio} ಪಟ್ಟು ಇದೆ, ಆದ್ದರಿಂದ ಇನ್ನೊಂದು
      ಘಟಕಕ್ಕೆ ಜಾಗವಿದೆ.
    cites: [hces_2023_24, economic_census_2013]

  - id: saturated_market
    quadrant: threat
    when: {metric: demand_supply_ratio, op: "<", value: 0.9}
    text_en: >-
      The catchment already supports about {competitors_point} enterprises against estimated
      demand of {demand_supply_ratio}× capacity. Expect to win customers from existing sellers
      rather than from new demand.
    text_hi: >-
      क्षेत्र में पहले से लगभग {competitors_point} इकाइयाँ हैं और माँग क्षमता का
      {demand_supply_ratio} गुना है। नए ग्राहक नहीं, मौजूदा दुकानों से ग्राहक लेने होंगे।
    text_kn: >-
      ಈ ಪ್ರದೇಶವು ಈಗಾಗಲೇ ಸುಮಾರು {competitors_point} ಉದ್ಯಮಗಳನ್ನು ಹೊಂದಿದೆ, ಅಂದಾಜು ಬೇಡಿಕೆ ಸಾಮರ್ಥ್ಯದ
      {demand_supply_ratio} ಪಟ್ಟು. ಹೊಸ ಬೇಡಿಕೆಯಿಂದಲ್ಲ, ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಮಾರಾಟಗಾರರಿಂದ ಗ್ರಾಹಕರನ್ನು
      ಗಳಿಸಬೇಕಾಗುತ್ತದೆ.
    cites: [hces_2023_24, economic_census_2013]

  - id: large_catchment
    quadrant: strength
    when: {metric: households_now, op: ">=", value: 8000}
    text_en: >-
      About {households_now} households across {villages_in_radius} villages fall within
      {radius_km} km, a catchment large enough to absorb a full-time unit.
    text_hi: >-
      {radius_km} किमी के भीतर {villages_in_radius} गाँवों के लगभग {households_now} परिवार आते हैं,
      जो पूर्णकालिक इकाई के लिए पर्याप्त बाज़ार है।
    text_kn: >-
      ಸುಮಾರು {households_now} ಕುಟುಂಬಗಳು {villages_in_radius} ಗ್ರಾಮಗಳಲ್ಲಿ {radius_km} ಕಿಮೀ ಒಳಗೆ
      ಬರುತ್ತವೆ, ಇದು ಪೂರ್ಣಾವಧಿ ಘಟಕಕ್ಕೆ ಸಾಕಾಗುವಷ್ಟು ದೊಡ್ಡ ಪ್ರದೇಶ.
    cites: [census_pc11, intercensal_scaling]

  - id: thin_catchment
    quadrant: weakness
    when: {metric: households_now, op: "<", value: 3000}
    text_en: >-
      Only about {households_now} households lie within {radius_km} km. Plan for a wider
      selling radius or a second income line from the start.
    text_hi: >-
      {radius_km} किमी में केवल लगभग {households_now} परिवार हैं। बिक्री क्षेत्र बढ़ाने या दूसरी आय
      की योजना शुरू से रखें।
    text_kn: >-
      {radius_km} ಕಿಮೀ ಒಳಗೆ ಸುಮಾರು {households_now} ಕುಟುಂಬಗಳು ಮಾತ್ರ ಇವೆ. ಆರಂಭದಿಂದಲೇ ವಿಸ್ತಾರವಾದ
      ಮಾರಾಟ ವ್ಯಾಪ್ತಿ ಇರಿಸಿ ಅಥವಾ ಎರಡನೇ ಆದಾಯದ ಯೋಜನೆ ಮಾಡಿ.
    cites: [census_pc11, intercensal_scaling]

  - id: banking_access
    quadrant: strength
    when: {metric: villages_with_bank, op: ">=", value: 3}
    text_en: >-
      {villages_with_bank} villages in the catchment have a bank branch, which shortens the
      disbursement and repayment cycle through the State Channelizing Agency.
    text_hi: >-
      क्षेत्र के {villages_with_bank} गाँवों में बैंक शाखा है, जिससे ऋण वितरण और किस्त जमा आसान होगी।
    text_kn: >-
      ಪ್ರದೇಶದ {villages_with_bank} ಗ್ರಾಮಗಳಲ್ಲಿ ಬ್ಯಾಂಕ್ ಶಾಖೆ ಇದೆ, ಇದು ರಾಜ್ಯ ವಾಹಕ ಸಂಸ್ಥೆ (ಎಸ್‌ಸಿಎ)
      ಮೂಲಕ ಹಣ ಬಿಡುಗಡೆ ಮತ್ತು ಕಂತು ಪೂರೈಕೆ ಚಕ್ರವನ್ನು ಸುಲಭಗೊಳಿಸುತ್ತದೆ.
    cites: [census_pc11]

  - id: no_banking_access
    quadrant: weakness
    when: {metric: villages_with_bank, op: "<", value: 1}
    text_en: >-
      No bank branch in the catchment. Every quarterly instalment will cost a day of travel, so
      budget for it and ask the SCA about a business correspondent.
    text_hi: >-
      क्षेत्र में कोई बैंक शाखा नहीं है। हर तिमाही किस्त पर एक दिन की यात्रा लगेगी, इसका खर्च जोड़ें।
    text_kn: >-
      ಪ್ರದೇಶದಲ್ಲಿ ಬ್ಯಾಂಕ್ ಶಾಖೆ ಇಲ್ಲ. ಪ್ರತಿ ತ್ರೈಮಾಸಿಕ ಕಂತಿಗೆ ಒಂದು ದಿನದ ಪ್ರಯಾಣ ಆಗುತ್ತದೆ, ಆದ್ದರಿಂದ
      ಅದರ ವೆಚ್ಚವನ್ನು ಲೆಕ್ಕಕ್ಕೆ ಸೇರಿಸಿ ಮತ್ತು ಎಸ್‌ಸಿಎಯಲ್ಲಿ ವ್ಯಾಪಾರ ಪ್ರತಿನಿಧಿಯ (ಬಿಸಿನೆಸ್
      ಕರೆಸ್ಪಾಂಡೆಂಟ್) ಬಗ್ಗೆ ಕೇಳಿ.
    cites: [census_pc11]

  - id: healthy_repayment_capacity
    quadrant: strength
    when: {metric: recommended_min_dscr, op: ">=", value: 1.5}
    text_en: >-
      At the recommended loan of {recommended_loan_fmt} the worst-year debt service coverage is
      {recommended_min_dscr}, comfortably above the 1.5 appraisal norm.
    text_hi: >-
      अनुशंसित ऋण {recommended_loan_fmt} पर सबसे कमजोर वर्ष का डीएससीआर {recommended_min_dscr} है,
      जो 1.5 के मानक से ऊपर है।
    text_kn: >-
      ಶಿಫಾರಸು ಮಾಡಿದ ಸಾಲ {recommended_loan_fmt} ನಲ್ಲಿ ಕೆಟ್ಟ ವರ್ಷದ ಡಿಎಸ್ಸಿಆರ್ {recommended_min_dscr}
      ಆಗಿದೆ, ಇದು 1.5 ಮೌಲ್ಯಮಾಪನ ಮಾನದಂಡಕ್ಕಿಂತ ಆರಾಮವಾಗಿ ಮೇಲಿದೆ.
    cites: [finance_engine, nabard_templates]

  - id: overborrowing_risk
    quadrant: threat
    when: {metric: max_loan_min_dscr, op: "<", value: 1.5}
    text_en: >-
      The scheme formula permits {max_loan_fmt}, at which the worst-year coverage falls to
      {max_loan_min_dscr}. Borrowing the maximum is the single largest risk to this unit.
    text_hi: >-
      योजना के सूत्र से {max_loan_fmt} तक ऋण मिल सकता है, जिस पर डीएससीआर घटकर
      {max_loan_min_dscr} रह जाता है। अधिकतम ऋण लेना ही सबसे बड़ा जोखिम है।
    text_kn: >-
      ಯೋಜನೆಯ ಸೂತ್ರದ ಪ್ರಕಾರ {max_loan_fmt} ವರೆಗೆ ಸಾಲ ಸಿಗಬಹುದು, ಅಲ್ಲಿ ಕೆಟ್ಟ ವರ್ಷದ ವ್ಯಾಪ್ತಿ
      {max_loan_min_dscr} ಕ್ಕೆ ಇಳಿಯುತ್ತದೆ. ಗರಿಷ್ಠ ಸಾಲ ತೆಗೆದುಕೊಳ್ಳುವುದೇ ಈ ಘಟಕದ ಅತಿದೊಡ್ಡ ಅಪಾಯ.
    cites: [finance_engine, nsfdc_term_loan]

  - id: capital_shortfall
    quadrant: weakness
    when: {metric: capital_shortfall, op: ">", value: 0}
    text_en: >-
      Serviceable debt falls {capital_shortfall_fmt} short of what the unit costs. Raise the
      promoter contribution, start smaller, or phase the investment across two years.
    text_hi: >-
      चुकाने योग्य ऋण इकाई की लागत से {capital_shortfall_fmt} कम है। स्वयं का अंशदान बढ़ाएँ,
      छोटे स्तर से शुरू करें, या निवेश दो चरणों में करें।
    text_kn: >-
      ತೀರಿಸಬಹುದಾದ ಸಾಲವು ಘಟಕದ ವೆಚ್ಚಕ್ಕಿಂತ {capital_shortfall_fmt} ಕಡಿಮೆ ಇದೆ. ಸ್ವಂತ ಹೂಡಿಕೆ ಹೆಚ್ಚಿಸಿ,
      ಚಿಕ್ಕದಾಗಿ ಪ್ರಾರಂಭಿಸಿ, ಅಥವಾ ಹೂಡಿಕೆಯನ್ನು ಎರಡು ವರ್ಷಗಳಿಗೆ ಹಂಚಿ.
    cites: [finance_engine, nabard_templates]

  - id: seasonal_cashflow
    quadrant: threat
    when: {metric: seasonality_cv, op: ">=", value: 0.45}
    text_en: >-
      Market arrivals for the linked commodity vary sharply across the year
      (coefficient of variation {seasonality_cv}). Quarterly instalments do not flex, so hold a
      reserve for the lean quarter.
    text_hi: >-
      संबंधित वस्तु की मंडी आवक साल भर बहुत बदलती है (सीवी {seasonality_cv})। तिमाही किस्त तय रहती है,
      इसलिए कमजोर तिमाही के लिए बचत रखें।
    text_kn: >-
      ಜೋಡಿಸಿದ ಸರಕಿನ ಮಾರುಕಟ್ಟೆ ಆಗಮನವು ವರ್ಷ ಪೂರ್ತಿ ತೀವ್ರವಾಗಿ ಬದಲಾಗುತ್ತದೆ (ವ್ಯತ್ಯಾಸ ಗುಣಾಂಕ
      {seasonality_cv}). ತ್ರೈಮಾಸಿಕ ಕಂತು ಬದಲಾಗದೆ ಇರುತ್ತದೆ, ಆದ್ದರಿಂದ ಕಡಿಮೆ ತ್ರೈಮಾಸಿಕಕ್ಕೆ ಮೀಸಲು
      ಇರಿಸಿ.
    cites: [agmarknet]

  - id: scheme_concession
    quadrant: opportunity
    when: {metric: in_scope, op: "==", value: true}
    text_en: >-
      This unit routes to the {scheme_name} at {rate_pct}% per annum against a market rate of
      12-18%. That concession is worth more than any cost saving you can negotiate locally.
    text_hi: >-
      यह इकाई {scheme_name} के अंतर्गत {rate_pct}% वार्षिक ब्याज पर आती है, जबकि बाज़ार दर 12-18% है।
      यह रियायत किसी भी स्थानीय बचत से बड़ी है।
    text_kn: >-
      ಈ ಘಟಕವು {scheme_name} ಅಡಿಯಲ್ಲಿ ವರ್ಷಕ್ಕೆ {rate_pct}% ಬಡ್ಡಿಗೆ ಸಿಗುತ್ತದೆ, ಮಾರುಕಟ್ಟೆ ದರ 12-18%
      ಇದ್ದಾಗ. ಈ ರಿಯಾಯಿತಿಯು ನೀವು ಸ್ಥಳೀಯವಾಗಿ ಮಾತುಕತೆ ಮಾಡಬಹುದಾದ ಯಾವುದೇ ವೆಚ್ಚ ಉಳಿತಾಯಕ್ಕಿಂತ ದೊಡ್ಡದು.
    cites: [nsfdc_micro_finance, nsfdc_term_loan]

  - id: skill_and_road
    quadrant: opportunity
    when:
      all:
        - {metric: literacy_rate, op: ">=", value: 0.65}
        - {metric: road_connected_share, op: ">=", value: 0.6}
    text_en: >-
      Literacy of {literacy_pct}% and {road_pct}% pucca-road coverage make this catchment
      suitable for a unit that needs record-keeping and regular deliveries.
    text_hi: >-
      {literacy_pct}% साक्षरता और {road_pct}% पक्की सड़क वाला यह क्षेत्र नियमित आपूर्ति और
      हिसाब-किताब वाली इकाई के लिए उपयुक्त है।
    text_kn: >-
      {literacy_pct}% ಅಕ್ಷರಸ್ಥತೆ ಮತ್ತು {road_pct}% ಪಕ್ಕಾ ರಸ್ತೆ ಹೊಂದಿರುವ ಈ ಪ್ರದೇಶವು ಲೆಕ್ಕಪತ್ರ
      ನಿರ್ವಹಣೆ ಮತ್ತು ನಿಯಮಿತ ಸರಬರಾಜು ಅಗತ್ಯವಿರುವ ಘಟಕಕ್ಕೆ ಸೂಕ್ತವಾಗಿದೆ.
    cites: [census_pc11]

  - id: distance_to_town
    quadrant: weakness
    when: {metric: dist_to_town_km, op: ">=", value: 25}
    text_en: >-
      The nearest town is {dist_to_town_km} km away. Input procurement and machinery repair
      will both carry a travel cost that thin margins cannot absorb repeatedly.
    text_hi: >-
      निकटतम शहर {dist_to_town_km} किमी दूर है। कच्चा माल और मशीन मरम्मत दोनों पर यात्रा खर्च लगेगा।
    text_kn: >-
      ಹತ್ತಿರದ ಪಟ್ಟಣ {dist_to_town_km} ಕಿಮೀ ದೂರದಲ್ಲಿದೆ. ಕಚ್ಚಾ ಸಾಮಗ್ರಿ ಪೂರೈಕೆ ಮತ್ತು ಯಂತ್ರ ದುರಸ್ತಿ
      ಎರಡಕ್ಕೂ ಪ್ರಯಾಣ ವೆಚ್ಚ ಆಗುತ್ತದೆ, ಇದನ್ನು ತೆಳುವಾದ ಅಂಚುಗಳು ಪದೇ ಪದೇ ಹೀರಿಕೊಳ್ಳಲಾರವು.
    cites: [census_pc11]
