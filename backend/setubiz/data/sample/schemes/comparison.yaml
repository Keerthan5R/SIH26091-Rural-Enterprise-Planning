# Informational comparison cards. These are NOT eligibility decisions; the engine only
# surfaces them alongside the routed NSFDC/NSKFDC/NBCFDC verdict (PLAN.md §5).

schemes:
  - id: pmmy
    name: Pradhan Mantri MUDRA Yojana (Shishu / Kishore / Tarun)
    name_hi: प्रधानमंत्री मुद्रा योजना
    name_kn: ಪ್ರಧಾನ ಮಂತ್ರಿ ಮುದ್ರಾ ಯೋಜನೆ (ಶಿಶು / ಕಿಶೋರ್ / ತರುಣ್)
    ministry: Ministry of Finance
    loan_range: [50000, 2000000]
    collateral_free: true
    highlights:
      - Shishu up to ₹50,000; Kishore ₹50,001–₹5 L; Tarun ₹5 L–₹10 L; Tarun Plus to ₹20 L.
      - Interest rate is set by the lending bank, not by the scheme.
    when_to_prefer: No caste-category eligibility; useful when the income ceiling is exceeded.
    when_to_prefer_hi: कोई जाति-श्रेणी पात्रता नहीं; आय सीमा पार होने पर उपयोगी।
    when_to_prefer_kn: ಜಾತಿ ವರ್ಗದ ಅರ್ಹತೆ ಇಲ್ಲ; ಆದಾಯ ಮಿತಿ ಮೀರಿದಾಗ ಉಪಯುಕ್ತ.
    portal: https://www.mudra.org.in/

  - id: pmegp
    name: Prime Minister's Employment Generation Programme
    name_hi: प्रधानमंत्री रोजगार सृजन कार्यक्रम
    name_kn: ಪ್ರಧಾನ ಮಂತ್ರಿ ಉದ್ಯೋಗ ಸೃಷ್ಟಿ ಕಾರ್ಯಕ್ರಮ
    ministry: Ministry of MSME / KVIC
    loan_range: [100000, 5000000]
    collateral_free: false
    highlights:
      - Capital subsidy of 25–35% in rural areas for special categories (SC/ST/women/OBC).
      - Manufacturing projects up to ₹50 L; service units up to ₹20 L.
    when_to_prefer: Larger units, and where a capital subsidy beats a concessional rate.
    when_to_prefer_hi: बड़े यूनिट, और जहाँ पूँजी सब्सिडी रियायती दर से बेहतर हो।
    when_to_prefer_kn: ದೊಡ್ಡ ಘಟಕಗಳಿಗೆ, ಮತ್ತು ಬಂಡವಾಳ ಸಬ್ಸಿಡಿ ರಿಯಾಯಿತಿ ಬಡ್ಡಿದರಕ್ಕಿಂತ ಉತ್ತಮವಾದಾಗ.
    portal: https://www.kviconline.gov.in/pmegpeportal/

  - id: cgtmse
    name: Credit Guarantee Fund Trust for Micro and Small Enterprises
    name_hi: सीजीटीएमएसई ऋण गारंटी
    name_kn: ಸೂಕ್ಷ್ಮ ಮತ್ತು ಸಣ್ಣ ಉದ್ಯಮಗಳ ಸಾಲ ಗ್ಯಾರಂಟಿ ನಿಧಿ ಟ್ರಸ್ಟ್
    ministry: Ministry of MSME
    loan_range: [100000, 50000000]
    collateral_free: true
    highlights:
      - A guarantee cover, not a loan. It removes the collateral demand from a bank loan.
    when_to_prefer: When the bank asks for collateral the applicant does not have.
    when_to_prefer_hi: जब बैंक वह संपार्श्विक माँगे जो आवेदक के पास नहीं है।
    when_to_prefer_kn: ಅರ್ಜಿದಾರರ ಬಳಿ ಇಲ್ಲದ ಭದ್ರತೆಯನ್ನು ಬ್ಯಾಂಕ್ ಕೇಳಿದಾಗ.
    portal: https://www.cgtmse.in/

  - id: dri
    name: Differential Rate of Interest scheme
    name_hi: विभेदक ब्याज दर योजना
    name_kn: ವಿಭಿನ್ನ ಬಡ್ಡಿದರ ಯೋಜನೆ
    ministry: Reserve Bank of India / scheduled banks
    loan_range: [0, 20000]
    collateral_free: true
    highlights:
      - 4% p.a. fixed rate for the weakest borrowers; strict income ceilings apply.
    when_to_prefer: Very small top-up needs below ₹20,000.
    when_to_prefer_hi: ₹20,000 से कम की बहुत छोटी अतिरिक्त ज़रूरत।
    when_to_prefer_kn: ₹20,000 ಕ್ಕಿಂತ ಕಡಿಮೆ ಬಹಳ ಸಣ್ಣ ಹೆಚ್ಚುವರಿ ಅಗತ್ಯಗಳಿಗೆ.
    portal: https://www.rbi.org.in/

  - id: stand_up_india
    name: Stand-Up India
    name_hi: स्टैंड-अप इंडिया
    name_kn: ಸ್ಟ್ಯಾಂಡ್-ಅಪ್ ಇಂಡಿಯಾ
    ministry: Department of Financial Services
    loan_range: [1000000, 10000000]
    collateral_free: false
    highlights:
      - Greenfield enterprise loans of ₹10 L–₹1 Cr for SC/ST and women entrepreneurs.
    when_to_prefer: Projects that exceed the NSFDC term loan envelope.
    when_to_prefer_hi: परियोजनाएँ जो एनएसएफडीसी टर्म ऋण सीमा से बड़ी हों।
    when_to_prefer_kn: ಎನ್ಎಸ್ಎಫ್ಡಿಸಿ ಅವಧಿ ಸಾಲದ ವ್ಯಾಪ್ತಿಯನ್ನು ಮೀರುವ ಯೋಜನೆಗಳಿಗೆ.
    portal: https://www.standupmitra.in/

handoffs:
  - id: pm_daksh
    name: PM-DAKSH skilling portal
    name_hi: पीएम-दक्ष
    note: >-
      Free skill training for SC/OBC/EBC/safai karamchari beneficiaries. Recommended before
      disbursement where the applicant has no prior experience in the chosen activity.
    portal: https://pmdaksh.dosje.gov.in/
