    address: Sector-2, Dhurwa, Ranchi 834004
    channel: District Welfare Officer at the district collectorate
  - state: Maharashtra
    state_code: MH
    corporations: [nsfdc, nbcfdc]
    name: Mahatma Phule Backward Class Development Corporation Ltd.
    name_hi: महात्मा फुले मागासवर्ग विकास महामंडळ
