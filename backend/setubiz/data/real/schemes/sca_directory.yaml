    state_code: JH
    corporations: [nsfdc, nskfdc, nbcfdc]
    name: Jharkhand State Scheduled Castes Co-operative Development Corporation Ltd.
    name_hi: झारखंड राज्य अनुसूचित जाति सहकारी विकास निगम लिमिटेड
